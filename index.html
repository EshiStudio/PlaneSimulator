<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlaneSimulator — рабочая область</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px; color: #fff; font-size: 15px; line-height: 1.6;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; pointer-events: none;
    text-shadow: 0 1px 2px #000; white-space: pre;
  }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; background: #333; z-index: 10;
  }
  #status[hidden] { display: none; }
  canvas { display: block; cursor: none; touch-action: none; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    pointer-events: none; display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #crosshair::before { width: 2px; height: 16px; left: -1px; top: -8px; }
  #crosshair::after { width: 16px; height: 2px; left: -8px; top: -1px; }
  #crosshair span {
    position: absolute; left: -2px; top: -2px; width: 4px; height: 4px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="status">Загрузка модели самолёта…</div>
<div id="hud"></div>
<div id="crosshair"><span></span></div>

<script src="./lib/peerjs.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlaneSimulator — рабочая область</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px; color: #fff; font-size: 15px; line-height: 1.6;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; pointer-events: none;
    text-shadow: 0 1px 2px #000; white-space: pre;
  }
  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #ddd;
    font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; pointer-events: none;
    white-space: nowrap;
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; background: #333; z-index: 10;
  }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<div id="loading">Загрузка модели самолёта…</div>
<div id="hud"></div>
<div id="hint">ЛКМ + мышь — вращение · колесо — зум · WASD/QE — камера · стрелки — самолёт · R — сброс</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';

// --- Сцена / камера / рендер ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b33);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);
camera.position.set(0, 30, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Камера управляется вручную и по умолчанию находится за хвостом.
const camState = { dist: 5, height: 3.5, orbit: 0 };

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

// --- Бесконечная земля: сетка рисуется шейдером, плоскость следует за камерой ---
const CELL = 10.0;      // размер клетки в метрах
const MAJOR = 50.0;     // крупные линии каждые 5 клеток
const GROUND_CONTACT_DEPTH = 0.01;
const GROUND_SIZE = 500;
const FADE_START = 170;
const FADE_END = 245;

const groundMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uCenter: { value: new THREE.Vector2(0, 0) },
    uFadeStart: { value: FADE_START },
    uFadeEnd: { value: FADE_END },
    uMinor: { value: new THREE.Color(0x9a9a9a) },
    uMajor: { value: new THREE.Color(0x4d4d4d) },
  },
  vertexShader: `
    varying vec4 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec2 uCenter;
    uniform float uFadeStart;
    uniform float uFadeEnd;
    uniform vec3 uMinor;
    uniform vec3 uMajor;
    varying vec4 vWorldPos;

    float distToLine(vec2 p, float step) {
      vec2 f = fract(p / step);
      vec2 g = 0.5 - abs(f - 0.5);          // 0 на линии, 0.5 между линиями
      vec2 fw = fwidth(p / step);
      vec2 l = 1.0 - smoothstep(vec2(0.0), fw, g);
      return max(l.x, l.y);
    }

    void main() {
      vec2 coord = vWorldPos.xz;
      float minor = distToLine(coord, ${CELL.toFixed(1)});  // клетки
      float major = distToLine(coord, ${MAJOR.toFixed(1)}); // крупные линии

      vec3 color = mix(vec3(0.96), uMajor, major);        // белый пол + тёмные линии
      color = mix(color, uMinor, minor * (1.0 - major));  // + серые линии

      float dist = distance(coord, uCenter);
      float fade = 1.0 - smoothstep(uFadeStart, uFadeEnd, dist);
      gl_FragColor = vec4(color, fade);
    }
  `,
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Прозрачная плоскость принимает настоящую тень поверх процедурной сетки.
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.32 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = 0.002;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

// --- Самолёт из assets/ ---
const planeGroup = new THREE.Group();
scene.add(planeGroup);

const loader = new GLTFLoader();
loader.load('./assets/stylized_ww1_plane.glb', (gltf) => {
  const model = gltf.scene;
  const flightEffects = [];
  const solidMeshes = [];
  model.traverse(node => {
    if (!node.isMesh) return;
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    const isFlightEffect = materials.some(material => {
      const name = material?.name?.toLowerCase();
      return name === 'blur_effect' || name === 'lambert1';
    });
    if (isFlightEffect) {
      flightEffects.push(node);
      return;
    }
    const isOutline = materials.some(material => material?.name?.toLowerCase() === 'tooner');
    node.castShadow = !isOutline;
    node.receiveShadow = !isOutline;
    if (!isOutline) solidMeshes.push(node);
  });
  flightEffects.forEach(node => node.removeFromParent());

  const box = new THREE.Box3();
  solidMeshes.forEach(node => box.union(new THREE.Box3().setFromObject(node)));
  const span = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
  const scale = span > 0.001 ? 6.0 / span : 1.0;
  model.scale.setScalar(scale);
  // Компенсация крена вправо, заметного при взгляде с носа.
  model.rotation.z = THREE.MathUtils.degToRad(3);
  // Парковочный тангаж самолёта с передними основными колёсами.
  model.rotation.x = THREE.MathUtils.degToRad(-8);

  // После крена и тангажа ставим реальную геометрию на пол. Контурная
  // Tooner-оболочка в расчёт не входит: она выступает вниз почти на 0.5 м.
  model.updateMatrixWorld(true);
  const groundedBox = new THREE.Box3();
  solidMeshes.forEach(node => groundedBox.union(new THREE.Box3().setFromObject(node)));
  model.position.y -= groundedBox.min.y + GROUND_CONTACT_DEPTH;
  planeGroup.add(model);

  // --- Пропеллер: лопасти (polySurface304/305/306) собираются в общий pivot,
  // ось которого проходит через центр винта, — так их можно вращать вокруг оси Z.
  propPivot = new THREE.Object3D();
  const propMeshes = [];
  model.traverse(node => {
    if (!node.isMesh) return;
    const n = node.name;
    if (n.startsWith('polySurface304_') || n.startsWith('polySurface305_') || n.startsWith('polySurface306_')) {
      propMeshes.push(node);
    }
  });
  if (propMeshes.length > 0) {
    model.updateMatrixWorld(true);
    const box = new THREE.Box3();
    propMeshes.forEach(m => box.union(new THREE.Box3().setFromObject(m)));
    model.add(propPivot);
    propPivot.position.copy(model.worldToLocal(box.getCenter(new THREE.Vector3())));
    // Контурная Tooner-оболочка винта вращается вместе с лопастями.
    model.traverse(node => {
      if (node.isMesh && node.name === 'polySurface406_Tooner_0') propMeshes.push(node);
    });
    propMeshes.forEach(m => propPivot.attach(m));
  }

  // --- Закрылки: в модели уже есть светлые панели на задней кромке обоих
  // крыльев (polySurface161/165 — верхнее, polySurface173/174 — нижнее) плюс
  // их контурные Tooner-оболочки (407/408/410/411). Каждая панель с контуром
  // сажается на шарнир (ось X на её передней кромке) и отклоняется вниз-назад.
  model.updateMatrixWorld(true);
  const flapMeshes = [];
  model.traverse(node => {
    if (!node.isMesh) return;
    const n = node.name;
    if (n.startsWith('polySurface161_') || n.startsWith('polySurface165_') ||
        n.startsWith('polySurface173_') || n.startsWith('polySurface174_') ||
        n.startsWith('polySurface407_') || n.startsWith('polySurface408_') ||
        n.startsWith('polySurface410_') || n.startsWith('polySurface411_')) {
      flapMeshes.push(node);
    }
  });
  const flapPairs = new Map();
  flapMeshes.forEach(m => {
    const box = new THREE.Box3().setFromObject(m);
    const side = (box.min.x + box.max.x) / 2 > 0 ? 'R' : 'L';
    const level = (box.min.y + box.max.y) / 2 > 0.3 ? 'U' : 'D';
    const key = side + level;
    if (!flapPairs.has(key)) flapPairs.set(key, []);
    flapPairs.get(key).push(m);
  });
  flapPairs.forEach((meshes, key) => {
    // Ось шарнира — линия передней кромки панели (она наклонена вместе с крылом):
    // берём крайние по X вершины передней кромки и выравниваем локальную ось X
    // шарнира вдоль неё, чтобы панель поворачивалась, не отрываясь от крыла.
    const solid = meshes.filter(m => !m.name.includes('Tooner'));
    const verts = [];
    const tmpV = new THREE.Vector3();
    solid.forEach(m => {
      const pos = m.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        tmpV.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
        verts.push(tmpV.clone());
      }
    });
    let zMax = -Infinity;
    verts.forEach(p => { if (p.z > zMax) zMax = p.z; });
    const front = verts.filter(p => Math.abs(p.z - zMax) < 0.015);
    front.sort((a, b) => a.x - b.x);
    const p1 = front[0];
    const p2 = front[front.length - 1];
    // Ось вращения проходит через ЦЕНТР закрылка: панель вращается вокруг
    // себя (направление оси — размах панели, вдоль передней кромки).
    const box = new THREE.Box3();
    meshes.forEach(m => box.union(new THREE.Box3().setFromObject(m)));
    const hinge = new THREE.Group();
    hinge.position.copy(model.worldToLocal(box.getCenter(new THREE.Vector3())));
    const dirLocal = model.worldToLocal(p2.clone()).sub(model.worldToLocal(p1.clone()));
    if (dirLocal.lengthSq() > 1e-10) {
      hinge.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dirLocal.normalize());
    }
    model.add(hinge);
    meshes.forEach(m => hinge.attach(m));
    // У каждой панели свой угол отклонения: верхние отклоняются меньше нижних,
    // чтобы панели не двигались как одна пара.
    flapGroups.push({
      group: hinge,
      maxAngle: key[1] === 'U' ? FLAP_MAX_ANGLE_UPPER : FLAP_MAX_ANGLE_LOWER
    });
  });

  document.getElementById('loading').remove();
}, undefined, (err) => {
  console.error(err);
  document.getElementById('loading').textContent = 'Ошибка загрузки модели: ' + err;
});

let planeCell = { x: 0, z: 0 };
let planeYaw = 0;   // самолёт ориентирован носом по -Z

// --- Двигатель и пропеллер ---
let propPivot = null;
let engineOn = false;       // пробел заводит/глушит двигатель
let propAngle = 0;          // текущий угол лопастей
let propSpeed = 0;          // текущая угловая скорость, рад/с
const PROP_MAX_SPEED = 40;  // рад/с (~6.4 об/с)
const PROP_ACCEL = 18;      // рад/с^2 — плавная раскрутка и торможение

// --- Закрылки ---
let flapGroups = [];
let flapsOut = false;                 // F — выпустить/убрать
let flapAngle = 0;                    // текущий угол отклонения
const FLAP_MAX_ANGLE_UPPER = THREE.MathUtils.degToRad(25); // верхние закрылки
const FLAP_MAX_ANGLE_LOWER = THREE.MathUtils.degToRad(35); // нижние закрылки
const FLAP_SPEED = THREE.MathUtils.degToRad(120); // °/с — плавный ход

// --- Привязка камеры к самолёту: камера стоит за хвостом ---
const camLookTarget = new THREE.Vector3();

function updateCamera() {
  // направление от самолёта к камере: за хвост (хвост = -Z модели)
  const tailAngle = planeYaw + camState.orbit;
  const dx = -Math.sin(tailAngle);
  const dz = -Math.cos(tailAngle);
  camera.position.set(
    planeGroup.position.x + dx * camState.dist,
    planeGroup.position.y + camState.height,
    planeGroup.position.z + dz * camState.dist
  );
  camLookTarget.set(
    planeGroup.position.x,
    planeGroup.position.y + 1.2,
    planeGroup.position.z
  );
  camera.lookAt(camLookTarget);
}

function attachCameraToPlane() {
  updateCamera();
}

function placePlane(cell) {
  planeCell = cell;
  planeGroup.position.set(cell.x * CELL + CELL / 2, 0, cell.z * CELL + CELL / 2);
}

function face(dx, dz) {
  if (dx !== 0 || dz !== 0) planeYaw = Math.atan2(dx, dz);
  planeGroup.rotation.y = planeYaw;
}

function movePlane(dx, dz) {
  face(dx, dz);
  placePlane({ x: planeCell.x + dx, z: planeCell.z + dz });
}

placePlane({ x: 0, z: 0 });
attachCameraToPlane();

// --- Ввод ---
const ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
const pressedArrows = new Set();
const camKeys = new Set();

addEventListener('keydown', e => {
  if (ARROWS[e.code]) {
    if (!pressedArrows.has(e.code)) { pressedArrows.add(e.code); movePlane(...ARROWS[e.code]); }
    return;
  }
  if (e.code === 'KeyR') {
    camState.dist = 5; camState.height = 3.5; camState.orbit = 0;
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    engineOn = !engineOn;
    return;
  }
  if (e.code === 'KeyF') {
    flapsOut = !flapsOut;
    return;
  }
  camKeys.add(e.code);
});
addEventListener('keyup', e => { pressedArrows.delete(e.code); camKeys.delete(e.code); });

renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camState.dist = Math.max(3, Math.min(100, camState.dist * (e.deltaY > 0 ? 1.1 : 0.9)));
}, { passive: false });

let draggingCamera = false;
let lastPointerX = 0;
let lastPointerY = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  draggingCamera = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  renderer.domElement.classList.add('dragging');
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!draggingCamera) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  camState.orbit -= dx * 0.008;
  camState.height = THREE.MathUtils.clamp(camState.height - dy * 0.04, 0.5, 40);
});

function stopCameraDrag(e) {
  if (!draggingCamera) return;
  draggingCamera = false;
  renderer.domElement.classList.remove('dragging');
  if (renderer.domElement.hasPointerCapture(e.pointerId)) {
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
}

renderer.domElement.addEventListener('pointerup', stopCameraDrag);
renderer.domElement.addEventListener('pointercancel', stopCameraDrag);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- Главный цикл ---
const clock = new THREE.Clock();
const hud = document.getElementById('hud');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Камера управляется только мышью (ЛКМ — вращение, колесо — зум) и Q/E — высота
  if (camKeys.has('KeyQ')) camState.height = Math.max(0.5, camState.height - 8 * dt);
  if (camKeys.has('KeyE')) camState.height = Math.min(40, camState.height + 8 * dt);

  // камера всегда за хвостом самолёта
  updateCamera();

  // Двигатель: плавная раскрутка/остановка пропеллера
  if (propPivot) {
    if (engineOn) propSpeed = Math.min(PROP_MAX_SPEED, propSpeed + PROP_ACCEL * dt);
    else propSpeed = Math.max(0, propSpeed - PROP_ACCEL * dt);
    propAngle += propSpeed * dt;
    propPivot.rotation.z = propAngle;
  }

  // Закрылки: каждая панель плавно движется к своему углу отклонения
  flapAngle = 0;
  flapGroups.forEach(fg => {
    const target = flapsOut ? fg.maxAngle : 0;
    const cur = fg.group.rotation.x;
    const next = cur < -target
      ? Math.min(-target, cur + FLAP_SPEED * dt)
      : Math.max(-target, cur - FLAP_SPEED * dt);
    fg.group.rotation.x = next;
    if (next < 0) flapAngle = Math.max(flapAngle, -next);
  });

  // плоскость сетки всегда центрирована на камере (округление до метра
  // удерживает линии на целых мировых координатах)
  ground.position.x = Math.round(camera.position.x / CELL) * CELL;
  ground.position.z = Math.round(camera.position.z / CELL) * CELL;
  shadowGround.position.x = ground.position.x;
  shadowGround.position.z = ground.position.z;
  groundMat.uniforms.uCenter.value.set(ground.position.x, ground.position.z);

  // Свет и его теневая камера следуют за самолётом в безграничном мире.
  sun.position.set(
    planeGroup.position.x + 20,
    planeGroup.position.y + 35,
    planeGroup.position.z + 15
  );
  sun.target.position.copy(planeGroup.position);
  sun.target.updateMatrixWorld();

  const p = planeGroup.position;
  hud.textContent =
    `двигатель: ${engineOn ? 'ЗАВЕДЁН' : 'заглушен'}   ` +
    `закрылки: ${flapsOut ? `выпущены ${Math.round(THREE.MathUtils.radToDeg(flapAngle))}°` : 'убраны'}   ` +
    `самолёт: клетка (${planeCell.x}, ${planeCell.z})   мир (${p.x.toFixed(1)}, ${p.z.toFixed(1)}, ${p.y.toFixed(1)})` +
    '\nЛКМ+мышь — вращение | колесо — зум | Q/E — высота | стрелки — самолёт | Пробел — двигатель | F — закрылки | R — сброс камеры';

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>

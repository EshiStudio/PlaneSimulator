<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>selftest</title></head>
<body>
<div id="status" hidden></div><div id="hud"></div>
<script type="importmap">{ "imports": { "three": "../lib/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { Plane } from '../src/plane.js';

const log = m => console.log('TEST ' + m);
const deg = r => THREE.MathUtils.radToDeg(r).toFixed(1);
const run = (seconds) => { for (let i = 0; i < seconds * 60; i++) plane.update(1 / 60); };

const plane = new Plane();
const scene = new THREE.Scene();
scene.add(plane.group);

plane.load('../assets/stylized_ww1_plane.glb').then(() => {
  log(`элеронов: ${plane.ailerons.length} (ожидается 4)`);
  plane.ailerons.forEach(s => {
    const kids = s.pivot.children.map(c => c.name.split('_')[0]).join('+');
    log(`  ${s.side}${s.level} меши=${kids}`);
  });
  log(`половин руля высоты: ${plane.elevators.length} (ожидается 2)`);
  plane.elevators.forEach(p => log(`  меши=${p.children.map(c => c.name.split('_')[0]).join('+')}`));
  log(`винт: ${plane.propPivot ? plane.propPivot.children.length + ' мешей' : 'НЕ НАЙДЕН'}`);

  const box = new THREE.Box3().setFromObject(plane.group);
  log(`bbox: y ${box.min.y.toFixed(3)}..${box.max.y.toFixed(3)}, размах ${(box.max.x - box.min.x).toFixed(2)} м`);

  const right = plane.ailerons.find(s => s.side === 'R');
  const left = plane.ailerons.find(s => s.side === 'L');

  // W — руль высоты вверх, S — вниз.
  plane.pitchInput = 1;
  run(1);
  log(`W: руль высоты=${deg(plane.elevatorAngle)}° (ожидается +20, вверх)`);
  plane.pitchInput = -1;
  run(1);
  log(`S: руль высоты=${deg(plane.elevatorAngle)}° (ожидается -20, вниз)`);

  // D — крен вправо: правый элерон вверх, левый вниз.
  plane.pitchInput = 0;
  plane.rollInput = 1;
  run(1);
  log(`D: правый элерон=${deg(right.pivot.rotation.x)}° (вверх), левый=${deg(left.pivot.rotation.x)}° (вниз)`);
  plane.rollInput = -1;
  run(1);
  log(`A: правый элерон=${deg(right.pivot.rotation.x)}° (вниз), левый=${deg(left.pivot.rotation.x)}° (вверх)`);

  // Отпустили управление — всё возвращается в нейтраль.
  plane.rollInput = 0;
  plane.pitchInput = 0;
  run(1);
  log(`отпустили: элероны=${deg(right.pivot.rotation.x)}/${deg(left.pivot.rotation.x)}° руль=${deg(plane.elevatorAngle)}° (ожидается 0)`);

  // Самолёт остаётся на земле: системы полёта пока нет.
  log(`высота после всех нажатий: ${plane.group.position.y.toFixed(2)} м (ожидается 0)`);

  plane.move(0, -1);
  log(`стрелка вверх: клетка (${plane.cell.x}, ${plane.cell.z}), yaw=${deg(plane.yaw)}°`);
  log('DONE');
}).catch(e => log('ОШИБКА ' + (e?.message ?? e)));
</script>
</body></html>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>selftest</title></head>
<body>
<div id="status" hidden></div><div id="hud"></div>
<script type="importmap">{ "imports": { "three": "../lib/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { Plane } from '../src/plane.js';

const log = m => console.log('TEST ' + m);
const deg = r => THREE.MathUtils.radToDeg(r).toFixed(1);

const plane = new Plane();
const scene = new THREE.Scene();
scene.add(plane.group);

plane.load('../assets/stylized_ww1_plane.glb').then(() => {
  log(`групп закрылков: ${plane.flapGroups.length} (ожидается 4)`);
  const toModel = new THREE.Matrix4().copy(plane.model.matrixWorld).invert();
  plane.flapGroups.forEach(fg => {
    const kids = fg.group.children.map(c => c.name.split('_')[0]).join('+');
    // Габариты сплошной панели в собственных координатах модели.
    const panel = fg.group.children.find(c => !c.name.includes('Tooner'));
    const b = new THREE.Box3();
    const m = new THREE.Matrix4().multiplyMatrices(toModel, panel.matrixWorld);
    const pos = panel.geometry.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) b.expandByPoint(v.fromBufferAttribute(pos, i).applyMatrix4(m));
    const hinge = fg.group.parent;   // внешний узел держит положение и ось
    const o = hinge.position;
    const d = new THREE.Vector3(1, 0, 0).applyQuaternion(hinge.quaternion);
    log(`  ${fg.level} max=${deg(fg.maxAngle)}° меши=${kids}`);
    log(`     панель z ${b.min.z.toFixed(3)}..${b.max.z.toFixed(3)}  y ${b.min.y.toFixed(3)}..${b.max.y.toFixed(3)}  x ${b.min.x.toFixed(3)}..${b.max.x.toFixed(3)}`);
    log(`     ось: origin (${o.x.toFixed(3)}, ${o.y.toFixed(3)}, ${o.z.toFixed(3)})  dir (${d.x.toFixed(3)}, ${d.y.toFixed(3)}, ${d.z.toFixed(3)})`);
  });
  log(`винт: ${plane.propPivot ? plane.propPivot.children.length + ' мешей' : 'НЕ НАЙДЕН'}`);

  const box = new THREE.Box3().setFromObject(plane.group);
  log(`bbox самолёта: y ${box.min.y.toFixed(3)}..${box.max.y.toFixed(3)}, размах x ${(box.max.x - box.min.x).toFixed(2)} м`);
  log(`позиция группы: (${plane.group.position.x}, ${plane.group.position.z})`);

  // Выпускаем закрылки и заводим двигатель, прогоняем 1 с по 60 кадров.
  plane.flapsOut = true;
  plane.engineOn = true;
  for (let i = 0; i < 60; i++) plane.update(1 / 60);
  log(`после 1 с: закрылки верх=${deg(plane.flapAngleUpper)}° низ=${deg(plane.flapAngleLower)}° (ожидается 25/35)`);
  log(`винт: ${plane.propSpeed.toFixed(1)} рад/с, угол ${plane.propAngle.toFixed(2)} (должен быть < 6.29)`);

  // Убираем обратно.
  plane.flapsOut = false;
  for (let i = 0; i < 60; i++) plane.update(1 / 60);
  log(`после уборки: верх=${deg(plane.flapAngleUpper)}° низ=${deg(plane.flapAngleLower)}°  (ожидается 0/0)`);

  // Долгая работа двигателя не должна копить угол.
  for (let i = 0; i < 6000; i++) plane.update(1 / 60);
  log(`угол винта после 100 с: ${plane.propAngle.toFixed(3)} (должен быть < 6.29)`);

  plane.move(0, -1);
  log(`после стрелки вверх: клетка (${plane.cell.x}, ${plane.cell.z}), мир (${plane.group.position.x}, ${plane.group.position.z}), yaw=${deg(plane.yaw)}°`);
  log('DONE');
}).catch(e => log('ОШИБКА ' + (e?.message ?? e)));
</script>
</body></html>
